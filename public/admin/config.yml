# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: fabricio-boppre/dveras3
  branch: sveltia
  # This line below must be commented when working in development mode, so the CMS doesn't try to authenticate with GitHub. Uncomment it when deploying the CMS to production.
  base_url: https://dveras3-sveltia-cms-auth.dauro-veras.workers.dev/

media_folder: /public/images/content
public_folder: /images/content

slug:
  clean_accents: true

collections:
  # File Collection for "Sobre":
  - name: paginas
    label: Páginas
    files:
      - name: sobre
        label: Sobre
        file: src/content/paginas/sobre.md
        fields:
          - { name: body, label: Body, widget: richtext }

  # This collection is used to manage the categories of posts in the blog. It uses a JSON file to store the data.
  # https://sveltiacms.app/en/docs/collections/entries/single-file
  - name: categorias
    label: Categorias de posts
    label_singular: Categoria de post
    file: src/content/categorias.json
    create: true
    identifier_field: titulo
    fields:
      - name: id
        label: ID
        widget: string
      - name: titulo
        label: Título
        widget: string

  # This collection is used to manage the posts in the blog. It uses a folder structure to store each post as a separate file.
  # https://sveltiacms.app/en/docs/collections/entries
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/blog
    create: true
    identifier_field: titulo
    sortable_fields:
      fields:
        - titulo
        - data_publicacao
      default:
        field: data_publicacao
        direction: Descending
    fields:
      - name: titulo
        label: Título
        widget: string

      - name: offline
        label: Offline
        widget: boolean
        default: false

      - name: descricao
        label: Descrição
        widget: string

      - name: data_publicacao
        label: Data de publicação
        widget: datetime
        type: date

      - name: exibicao_index
        label: Modo de exibição nos índices
        widget: list
        required: true
        min: 1
        max: 1
        add_to_top: false
        typeKey: modo
        hint: >-
          Escolha como você pretende que este post seja exibido no índice da
          tela inicial do blog e em outros índices.
        types:
          - name: descricao
            label: Exibir apenas a descrição
            widget: object
            fields: []
          - name: post_completo
            label: Exibir o post completo
            widget: object
            fields: []
          - name: imagem_ilustrativa
            label: Exibir imagem ilustrativa
            widget: object
            fields:
              - name: imagem
                label: Imagem ilustrativa
                widget: image
                required: true

      - name: relatedCategorias
        label: Categorias relacionadas
        widget: relation
        collection: categorias
        dropdown_threshold: 15
        search_fields:
          - titulo
        value_field: id
        display_fields:
          - titulo
        multiple: true
        min: 1
        required: true
        hint: Ao menos uma categoria deve ser escolhida.

      - name: body
        label: Post
        widget: richtext
